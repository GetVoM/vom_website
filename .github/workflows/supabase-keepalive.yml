# Supabase pauses a free project after a week without activity, and the public
# site is static, so readers alone would not keep it awake. A paused project
# fails the next build and the admin. This reads one row every day.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 5 * * *" # 08:17 in Riyadh
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read one category through the public API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "Supabase answered $status"
          test "$status" = "200"
